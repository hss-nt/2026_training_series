site_name: Formation dispensée par l'équipe pour les sciences humaines et sociales
site_url: https://hss-nt.github.io/training/fr

docs_dir: '../../docs/fr'

theme:
  name: material
  language: fr
  palette:
    primary: blue
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy

markdown_extensions:
  - def_list
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      
nav:
  - Séries de formation, 2026-27: fr/index.md
  
extra: 
  alternate:
    - name:  English
      link: /training/
      lang: en
    - name: Français
      link: /training/fr/
      lang: fr



extra_css:
  - docs/stylesheets/extra.css
