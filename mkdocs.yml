site_name: Humanities & Social Sciences National Team Training
site_url: https://hss-nt.github.io/training/
theme:
  name: material
  language: en
  palette:
    primary: blue
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy

markdown_extensions:
  - def_list
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      
nav:
  - 2026-27 Training Series: index.md

plugins:
  - i18n:
      default_language: en
      languages:
        en:
          name: English
          build: true
        fr:
          name: Français
          build: true
      # Optional: Translate the navigation sidebar titles
      nav_translations:
        fr:
          2026-27 Training Series: Série de formations, 2026-27
  
# extra: 
#   alternate:
#     - name:  English
#       link: /training/
#       lang: en
#     - name: Français
#       link: /training/fr/
#       lang: fr



extra_css:
  - stylesheets/extra.css
