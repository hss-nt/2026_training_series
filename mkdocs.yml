site_name: Humanities & Social Sciences National Team Training
site_url: https://hss-nt.github.io/training/
theme:
  name: material
  language: en
  palette:
    primary: blue
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy

markdown_extensions:
  - def_list
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      
  
extra: 
  alternate:
    - name:  English
      link: /training/
      lang: en
      nav:
        - 2026-27 Training Series: index.md
    - name: Français
      link: /training/fr/
      lang: fr
      nav:
        - Formation: fr/index.md 



extra_css:
  - stylesheets/extra.css
